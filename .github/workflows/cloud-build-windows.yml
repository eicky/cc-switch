name: Cloud Build Windows EXE

on:
  push:
    branches:
      - "ci/**"
      - "custom-build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows production EXE
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.95.0"

      - name: Setup pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version
          rustc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production EXE
        run: pnpm exec tauri build --no-bundle

      - name: Upload production EXE
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-x64-production
          path: src-tauri/target/release/cc-switch.exe
          if-no-files-found: error
          retention-days: 7
